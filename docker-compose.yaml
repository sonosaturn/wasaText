version: '3.8'

services:
  # BACKEND SERVICE (GO API)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"  # Exposes the API on port 3000 of your PC
    volumes:
      # Data persistence (Database and Images)
      - ./wasa.db:/app/wasatext.db
      - ./images:/app/images
      - ./avatars:/app/avatars
    environment:
      - GO_ENV=production
    restart: always

  # FRONTEND SERVICE (NGINX)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"    # Exposes the website on port 8080 of your PC
    depends_on:
      - backend      # Starts the frontend only after the backend
    restart: always