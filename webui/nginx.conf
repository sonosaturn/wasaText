events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_max_body_size 10M;
    
    server {
        listen 80;

        # Serve i file statici compilati di Vue (la cartella dist)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Inoltra le chiamate API al container del backend
        location ~ ^/(session|conversations|users|groups|images|avatars|liveness) {
            proxy_pass http://backend:3000;
        }
    }
}